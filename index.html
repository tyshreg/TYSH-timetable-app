<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>教師共同空堂查詢平台</title>
  <style>
    :root {
      /* Cafe Cajon 質感日系暖咖色票 */
      --bg-main: #f4efe6;          /* 暖亞麻底色 */
      --bg-sub: #ebe4d8;           /* 次級底色 */
      --card-bg: #fdfcf9;          /* 奶白卡片底色 */
      --text-main: #3d2e24;        /* 深焙咖啡主文字 */
      --text-muted: #7d6e63;       /* 研磨淺咖副文字 */
      --border-color: #dfd5c6;     /* 柔和燕麥邊框 */
      
      --accent-blue: #5b8c99;      /* Cajon 招牌湖水青 */
      --accent-blue-light: #e8f1f3;
      --accent-brown: #8c6239;     /* 烘焙焦糖棕 */
      --accent-brown-light: #f7eee4;
      
      --free-bg: #eaf3ed;          /* 柔和抹茶綠（空堂） */
      --free-text: #2d5a3c;
      --almost-bg: #fdf5e6;        /* 烤杏仁色（差1人） */
      --almost-text: #8c601a;
      --busy-bg: #fbeeed;          /* 柔和紅豆色（有課） */
      --busy-text: #963832;

      --radius: 10px;
      --shadow: 0 2px 8px rgba(61, 46, 36, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Hiragino Kaku Gothic ProN", "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    /* 頂部 Header */
    header {
      background: var(--card-bg);
      border-bottom: 1.5px solid var(--border-color);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-box {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span.logo-box {
      background: var(--accent-blue);
      color: white;
      font-size: 0.8rem;
      padding: 3px 7px;
      border-radius: 6px;
      font-weight: bold;
    }

    /* 學期切換選單 (頂部) */
    .semester-control {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-sub);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .semester-control label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .semester-select {
      background: transparent;
      border: none;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    .main-wrap {
      max-width: 1200px;
      margin: 12px auto 0;
      padding: 0 12px;
    }

    @media (min-width: 768px) {
      .main-wrap { padding: 0 20px; margin-top: 16px; }
      .brand-title { font-size: 1.35rem; }
    }

    /* 導覽分頁 (簡約暖色切換列) */
    .nav-tabs {
      display: flex;
      background: var(--bg-sub);
      padding: 4px;
      border-radius: var(--radius);
      margin-bottom: 14px;
      gap: 4px;
      border: 1px solid var(--border-color);
    }

    .nav-tab-btn {
      flex: 1;
      padding: 9px 4px;
      border: none;
      background: transparent;
      border-radius: 7px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .nav-tab-btn.active {
      background: var(--card-bg);
      color: var(--text-main);
      box-shadow: 0 1px 4px rgba(61, 46, 36, 0.08);
      font-weight: 700;
    }

    /* 內容面版 */
    .panel {
      display: none;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .panel.active { display: block; }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .panel-head h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-pill {
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 600;
      background: var(--accent-brown-light);
      color: var(--accent-brown);
      border: 1px solid var(--border-color);
    }

    /* 教師選擇佈局 */
    .selector-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (min-width: 860px) {
      .selector-grid {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 16px;
      }
    }

    .input-clean {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.88rem;
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
      margin-bottom: 8px;
    }

    .input-clean:focus {
      border-color: var(--accent-brown);
    }

    .picker-box {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      background: var(--bg-main);
    }

    .picker-scroll {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    @media (min-width: 860px) {
      .picker-scroll { max-height: 310px; }
    }

    .teacher-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .teacher-item:hover {
      background: var(--accent-brown-light);
    }

    .teacher-item.selected {
      background: var(--accent-brown-light);
      color: var(--accent-brown);
      font-weight: 700;
    }

    .role-badge {
      font-size: 0.7rem;
      background: var(--bg-sub);
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* 已選教師 Chips 盒 */
    .chips-box {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      background: var(--bg-main);
      display: flex;
      flex-direction: column;
      min-height: 80px;
    }

    .chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .chip-del {
      cursor: pointer;
      color: var(--text-muted);
      font-weight: bold;
    }

    .chip-del:hover { color: var(--busy-text); }

    /* 課表格子與 RWD 凍結欄 */
    .scroll-tip {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .timetable-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    table.timetable {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 580px;
      text-align: center;
      font-size: 0.82rem;
      background: var(--card-bg);
    }

    table.timetable th, table.timetable td {
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 4px;
      vertical-align: middle;
    }

    table.timetable th {
      background: var(--bg-sub);
      font-weight: 700;
      color: var(--text-main);
    }

    table.timetable th.sticky-col,
    table.timetable td.sticky-col {
      position: sticky;
      left: 0;
      background: var(--bg-sub);
      font-weight: 700;
      width: 60px;
      min-width: 60px;
      z-index: 10;
      box-shadow: 2px 0 4px rgba(61, 46, 36, 0.04);
    }

    /* 空堂狀態色 */
    .cell-free {
      background: var(--free-bg) !important;
      color: var(--free-text);
      font-weight: 700;
    }

    .free-pill {
      display: inline-block;
      background: var(--free-text);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
    }

    .cell-almost {
      background: var(--almost-bg) !important;
      color: var(--almost-text);
      text-align: left;
      padding: 5px !important;
      font-size: 0.72rem;
    }

    .cell-busy {
      background: var(--busy-bg) !important;
      color: var(--busy-text);
      text-align: left;
      padding: 5px !important;
      font-size: 0.72rem;
    }

    .busy-tag {
      display: inline-block;
      background: rgba(150, 56, 50, 0.1);
      color: var(--busy-text);
      padding: 1px 4px;
      border-radius: 3px;
      margin: 1px 2px 1px 0;
      font-size: 0.7rem;
    }

    /* 個人課表格子 */
    .cell-lesson {
      background: var(--accent-brown-light) !important;
      text-align: left;
      padding: 6px 5px !important;
      border-left: 3px solid var(--accent-brown) !important;
    }

    .lesson-title {
      font-weight: 700;
      color: var(--text-main);
      font-size: 0.82rem;
      line-height: 1.25;
    }

    .lesson-info {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* 依時段反查 */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .filter-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 120px;
    }

    .filter-item label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    select {
      padding: 8px 10px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
      max-height: 460px;
      overflow-y: auto;
      margin-top: 10px;
    }

    .teacher-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 9px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-action {
      background: transparent;
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Loading 遮罩 */
    #loading-mask {
      position: fixed;
      inset: 0;
      background: rgba(244, 239, 230, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      color: var(--text-main);
      font-weight: bold;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent-brown);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading-mask">
    <div class="spinner"></div>
    <div>連線雲端排課資料中...</div>
  </div>

  <header>
    <div class="header-box">
      <div class="brand-title">
        <span class="logo-box">課表</span>
        <span>教師共同空堂平台</span>
      </div>
      
      <!-- 學年度切換器 -->
      <div class="semester-control">
        <label>學期：</label>
        <select id="semester-selector" class="semester-select" onchange="switchSemester()">
          <option value="">載入中...</option>
        </select>
      </div>
    </div>
  </header>

  <div class="main-wrap">
    <!-- 簡約分頁列 -->
    <div class="nav-tabs">
      <button class="nav-tab-btn active" onclick="goNav('common')">共同空堂</button>
      <button class="nav-tab-btn" onclick="goNav('slot')">時段反查</button>
      <button class="nav-tab-btn" onclick="goNav('personal')">個人課表</button>
    </div>

    <!-- TAB 1: 共同空堂 -->
    <div id="tab-common" class="panel active">
      <div class="panel-head">
        <h2>跨教師空堂交叉比對</h2>
        <span id="common-count-badge" class="badge-pill" style="display:none;">0 節共同空堂</span>
      </div>

      <div class="selector-grid">
        <div class="picker-box">
          <input type="text" id="picker-search" class="input-clean" placeholder="🔍 搜尋教師姓名或職務..." oninput="drawPicker()">
          <div class="picker-scroll" id="picker-list"></div>
        </div>

        <div class="chips-box">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:0.8rem; font-weight:700;">
            <span>已選教師（<span id="sel-count">0</span> 人）</span>
            <span style="color:var(--text-muted); cursor:pointer; font-size:0.75rem;" onclick="clearSelection()">清空已選</span>
          </div>
          <div class="chips-container" id="chips-list">
            <span style="color:var(--text-muted); font-size:0.75rem; margin:auto;">請點選左側名單加入比對...</span>
          </div>
        </div>
      </div>

      <div class="scroll-tip">👈 手機版可左右滑動查看週一至週五 👉</div>
      <div class="timetable-wrap">
        <table class="timetable">
          <thead>
            <tr>
              <th class="sticky-col">節次</th>
              <th>週一</th>
              <th>週二</th>
              <th>週三</th>
              <th>週四</th>
              <th>週五</th>
            </tr>
          </thead>
          <tbody id="common-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- TAB 2: 依時段反查 -->
    <div id="tab-slot" class="panel">
      <div class="panel-head">
        <h2>指定節次反查空堂教師</h2>
        <span id="slot-count-badge" class="badge-pill">空堂：0 人</span>
      </div>

      <div class="filter-row">
        <div class="filter-item">
          <label>星期</label>
          <select id="slot-day" onchange="runSlotQuery()">
            <option value="1">星期一</option><option value="2">星期二</option>
            <option value="3">星期三</option><option value="4">星期四</option><option value="5">星期五</option>
          </select>
        </div>
        <div class="filter-item">
          <label>節次</label>
          <select id="slot-period" onchange="runSlotQuery()">
            <option value="1">第 1 節</option><option value="2">第 2 節</option><option value="3">第 3 節</option><option value="4">第 4 節</option>
            <option value="5">第 5 節</option><option value="6">第 6 節</option><option value="7">第 7 節</option><option value="8">第 8 節</option>
          </select>
        </div>
        <div class="filter-item" style="flex: 2; min-width: 180px;">
          <label>關鍵字過濾</label>
          <input type="text" id="slot-kw" class="input-clean" style="margin-bottom:0;" placeholder="搜尋導師、數學、組長..." oninput="runSlotQuery()">
        </div>
      </div>

      <div class="cards-grid" id="slot-results"></div>
    </div>

    <!-- TAB 3: 個人課表 -->
    <div id="tab-personal" class="panel">
      <div class="panel-head">
        <h2>教師個人全週課表</h2>
        <span id="personal-hours-badge" class="badge-pill">每週總節數：0 節</span>
      </div>

      <div style="margin-bottom: 12px;">
        <select id="personal-select" style="width:100%;" onchange="renderPersonalTable()"></select>
      </div>

      <div class="scroll-tip">👈 手機版可左右滑動查看週一至週五 👉</div>
      <div class="timetable-wrap">
        <table class="timetable">
          <thead>
            <tr>
              <th class="sticky-col">節次</th>
              <th>週一</th>
              <th>週二</th>
              <th>週三</th>
              <th>週四</th>
              <th>週五</th>
            </tr>
          </thead>
          <tbody id="personal-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // 填入您重新部署為「所有人」存取的 Apps Script 網址 (/exec 結尾)
    const GAS_API_URL = "https://script.google.com/macros/library/d/1XJbzmCLALcqzUBNCZRVw6_h-iyiThzgshLDEANq1IGYwwMPNtE9mlwmH/2";

    let ALL_DATA = {};
    let CURRENT_SEM = "";
    let ACTIVE_DATA = { teachers: [], schedules: {} };
    let selectedTids = new Set();
    const DAYS = ["星期一", "星期二", "星期三", "星期四", "星期五"];

    // 具備「自動重試」的穩健資料撈取函式
    async function fetchWithRetry(url, retries = 2, delay = 1500) {
      for (let i = 0; i <= retries; i++) {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP 錯誤碼: ${res.status}`);
          return await res.json();
        } catch (err) {
          if (i === retries) throw err;
          // 若為第一次遇到睡眠啟動逾時，等待 1.5 秒後重試
          await new Promise(r => setTimeout(r, delay));
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const loadingEl = document.getElementById('loading-mask');
      
      fetchWithRetry(GAS_API_URL)
        .then(resp => {
          ALL_DATA = resp.data || {};
          const sems = resp.semesters || [];

          if (sems.length === 0) {
            throw new Error('試算表中無相符學期工作表（如 115-1）');
          }

          // 填入學期選單
          const semSelect = document.getElementById('semester-selector');
          semSelect.innerHTML = '';
          sems.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.innerText = `${s} 學期`;
            semSelect.appendChild(opt);
          });

          // 預設切換至最新學期
          CURRENT_SEM = sems[0];
          semSelect.value = CURRENT_SEM;
          loadSemesterData(CURRENT_SEM);

          loadingEl.style.display = 'none';
        })
        .catch(err => {
          console.error(err);
          loadingEl.innerHTML = `
            <div style="color:var(--busy-text); text-align:center; padding:24px; max-width:320px;">
              <p style="font-weight:bold; margin-bottom:8px;">連線暫時逾時</p>
              <p style="font-size:0.78rem; color:var(--text-muted); margin-bottom:16px;">
                Google 雲端伺服器正在重新喚醒中，請點擊下方按鈕重新整理。
              </p>
              <button onclick="location.reload()" style="padding:6px 16px; border-radius:6px; background:var(--accent-brown); color:white; border:none; cursor:pointer;">
                重新連線
              </button>
            </div>
          `;
        });
    });

    // 切換學期觸發
    function switchSemester() {
      const semSelect = document.getElementById('semester-selector');
      CURRENT_SEM = semSelect.value;
      
      // 若該學期資料尚未載入，即時向 GAS 抓取該學期
      if (!ALL_DATA[CURRENT_SEM]) {
        const loadingEl = document.getElementById('loading-mask');
        loadingEl.style.display = 'flex';
        loadingEl.querySelector('div:last-child').innerText = `載入 ${CURRENT_SEM} 學期中...`;

        fetchWithRetry(`${GAS_API_URL}?sem=${CURRENT_SEM}`)
          .then(resp => {
            if (resp.data && resp.data[CURRENT_SEM]) {
              ALL_DATA[CURRENT_SEM] = resp.data[CURRENT_SEM];
              loadSemesterData(CURRENT_SEM);
            }
            loadingEl.style.display = 'none';
          })
          .catch(err => {
            alert(`載入 ${CURRENT_SEM} 學期失敗，請重試！`);
            loadingEl.style.display = 'none';
          });
      } else {
        loadSemesterData(CURRENT_SEM);
      }
    }

    function loadSemesterData(semKey) {
      ACTIVE_DATA = ALL_DATA[semKey] || { teachers: [], schedules: {} };
      selectedTids.clear();
      updateSelectedChips();
      drawPicker();
      renderCommonTable();
      initPersonalSelect();
      runSlotQuery();
    }

    function goNav(tabId) {
      document.querySelectorAll('.nav-tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      if (tabId === 'common') {
        document.querySelectorAll('.nav-tab-btn')[0].classList.add('active');
        document.getElementById('tab-common').classList.add('active');
      } else if (tabId === 'slot') {
        document.querySelectorAll('.nav-tab-btn')[1].classList.add('active');
        document.getElementById('tab-slot').classList.add('active');
        runSlotQuery();
      } else {
        document.querySelectorAll('.nav-tab-btn')[2].classList.add('active');
        document.getElementById('tab-personal').classList.add('active');
        renderPersonalTable();
      }
    }

    // ================= 1. 共同空堂比對 =================
    function drawPicker() {
      const q = document.getElementById('picker-search').value.trim().toLowerCase();
      const list = document.getElementById('picker-list');
      list.innerHTML = '';

      ACTIVE_DATA.teachers.filter(t => 
        t.教師名稱.toLowerCase().includes(q) ||
        t.教師職務.toLowerCase().includes(q) ||
        t.教師代碼.toLowerCase().includes(q)
      ).forEach(t => {
        const isSel = selectedTids.has(t.教師代碼);
        const row = document.createElement('div');
        row.className = `teacher-item ${isSel ? 'selected' : ''}`;
        row.innerHTML = `
          <div><span>${t.教師名稱}</span><span style="font-size:0.7rem; color:var(--text-muted); margin-left:3px;">(${t.教師代碼})</span></div>
          <span class="role-badge">${t.教師職務}</span>
        `;
        row.onclick = () => toggleTeacher(t.教師代碼);
        list.appendChild(row);
      });
    }

    function toggleTeacher(tid) {
      if (selectedTids.has(tid)) selectedTids.delete(tid);
      else selectedTids.add(tid);
      updateSelectedChips();
      drawPicker();
      renderCommonTable();
    }

    function clearSelection() {
      selectedTids.clear();
      updateSelectedChips();
      drawPicker();
      renderCommonTable();
    }

    function updateSelectedChips() {
      document.getElementById('sel-count').innerText = selectedTids.size;
      const box = document.getElementById('chips-list');
      if (selectedTids.size === 0) {
        box.innerHTML = '<span style="color:var(--text-muted); font-size:0.75rem; margin:auto;">請點選左側名單加入比對...</span>';
        document.getElementById('common-count-badge').style.display = 'none';
        return;
      }
      box.innerHTML = '';
      const tMap = new Map(ACTIVE_DATA.teachers.map(t => [t.教師代碼, t]));
      selectedTids.forEach(tid => {
        const t = tMap.get(tid);
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.innerHTML = `${t.教師名稱} (${t.教師職務}) <span class="chip-del" onclick="event.stopPropagation(); toggleTeacher('${tid}')">&times;</span>`;
        box.appendChild(chip);
      });
    }

    function renderCommonTable() {
      const tbody = document.getElementById('common-tbody');
      tbody.innerHTML = '';
      const selArr = Array.from(selectedTids);
      const tMap = new Map(ACTIVE_DATA.teachers.map(t => [t.教師代碼, t]));
      let freeCount = 0;

      for (let p = 1; p <= 8; p++) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="sticky-col">第 ${p} 節</td>`;
        for (let d = 1; d <= 5; d++) {
          const td = document.createElement('td');
          const key = `${d}-${p}`;
          if (selArr.length === 0) {
            td.innerHTML = '<span style="color:var(--border-color);">—</span>';
          } else {
            const busyWho = selArr.filter(tid => ACTIVE_DATA.schedules[tid] && ACTIVE_DATA.schedules[tid][key]).map(tid => tMap.get(tid).教師名稱);
            if (busyWho.length === 0) {
              td.className = 'cell-free';
              td.innerHTML = '<span class="free-pill">✓ 全員空堂</span>';
              freeCount++;
            } else if (busyWho.length === 1 && selArr.length > 2) {
              td.className = 'cell-almost';
              td.innerHTML = `<div style="font-weight:700; font-size:0.68rem;">★ 差 1 人</div><div>${busyWho[0]}</div>`;
            } else {
              td.className = 'cell-busy';
              let tags = busyWho.slice(0, 2).map(n => `<span class="busy-tag">${n}</span>`).join('');
              if (busyWho.length > 2) tags += `<span class="busy-tag">+${busyWho.length - 2}</span>`;
              td.innerHTML = `<div>${tags}</div>`;
            }
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }

      const badge = document.getElementById('common-count-badge');
      if (selArr.length > 0) {
        badge.style.display = 'inline-block';
        badge.innerText = `${freeCount} 節共同空堂`;
      }
    }

    // ================= 2. 依時段反查 =================
    function runSlotQuery() {
      const d = parseInt(document.getElementById('slot-day').value);
      const p = parseInt(document.getElementById('slot-period').value);
      const kw = document.getElementById('slot-kw').value.trim().toLowerCase();
      const key = `${d}-${p}`;

      let frees = ACTIVE_DATA.teachers.filter(t => {
        const isBusy = ACTIVE_DATA.schedules[t.教師代碼] && ACTIVE_DATA.schedules[t.教師代碼][key];
        const matchKw = !kw || t.教師名稱.toLowerCase().includes(kw) || t.教師職務.toLowerCase().includes(kw) || t.教師代碼.toLowerCase().includes(kw);
        return !isBusy && matchKw;
      });

      document.getElementById('slot-count-badge').innerText = `空堂：${frees.length} 人`;
      const container = document.getElementById('slot-results');
      container.innerHTML = '';

      if (frees.length === 0) {
        container.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:20px;">無符合條件的空堂教師</div>';
        return;
      }

      frees.forEach(t => {
        const card = document.createElement('div');
        card.className = 'teacher-card';
        card.innerHTML = `
          <div>
            <div style="font-weight:700; font-size:0.9rem;">${t.教師名稱}</div>
            <div style="font-size:0.72rem; color:var(--text-muted);">${t.教師職務}</div>
          </div>
          <button class="btn-action" onclick="jumpPersonal('${t.教師代碼}')">看課表</button>
        `;
        container.appendChild(card);
      });
    }

    function jumpPersonal(tid) {
      document.getElementById('personal-select').value = tid;
      goNav('personal');
    }

    // ================= 3. 個人課表 =================
    function initPersonalSelect() {
      const sel = document.getElementById('personal-select');
      sel.innerHTML = '';
      ACTIVE_DATA.teachers.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.教師代碼;
        opt.innerText = `${t.教師名稱} [${t.教師職務}] (${t.教師代碼})`;
        sel.appendChild(opt);
      });
      renderPersonalTable();
    }

    function renderPersonalTable() {
      const tid = document.getElementById('personal-select').value;
      const tbody = document.getElementById('personal-tbody');
      tbody.innerHTML = '';
      const sched = ACTIVE_DATA.schedules[tid] || {};
      let hours = 0;

      for (let p = 1; p <= 8; p++) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="sticky-col">第 ${p} 節</td>`;
        for (let d = 1; d <= 5; d++) {
          const td = document.createElement('td');
          const key = `${d}-${p}`;
          const items = sched[key];
          if (items && items.length > 0) {
            hours += items.length;
            td.className = 'cell-lesson';
            td.innerHTML = items.map(l => `
              <div>
                <div class="lesson-title">${l.s}</div>
                <div class="lesson-info">${l.c ? l.c : '跑班'}${l.r ? ' @' + l.r : ''}</div>
              </div>
            `).join('');
          } else {
            td.innerHTML = '<span style="color:var(--border-color);">—</span>';
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      document.getElementById('personal-hours-badge').innerText = `每週總節數：${hours} 節`;
    }
  </script>
</body>
</html>
