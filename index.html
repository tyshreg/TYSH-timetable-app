<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>教師共同空堂與課表查詢平台</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #10b981;
      --bg: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-600: #475569;
      --gray-800: #1e293b;
      --card-radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -2px rgba(0,0,0,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body { background-color: var(--bg); color: var(--gray-800); line-height: 1.5; padding-bottom: 50px; }

    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: white; padding: 20px 24px; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.15);
    }
    .header-box { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .header-box h1 { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .header-badge { font-size: 0.8rem; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 9999px; }

    .main-wrap { max-width: 1200px; margin: 20px auto 0; padding: 0 16px; }

    /* Tabs */
    .tabs { display: flex; gap: 8px; background: white; padding: 6px; border-radius: var(--card-radius); box-shadow: var(--shadow); margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; border-radius: 8px; font-size: 0.95rem; font-weight: 600; color: var(--gray-600); cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 2px 6px rgba(37,99,235,0.3); }

    .panel { display: none; background: white; border-radius: var(--card-radius); padding: 24px; box-shadow: var(--shadow); }
    .panel.active { display: block; }

    /* Teacher Pick Layout */
    .selector-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 800px) { .selector-grid { grid-template-columns: 1fr; } }
    
    .list-box { border: 1px solid var(--gray-200); border-radius: 8px; padding: 12px; height: 360px; display: flex; flex-direction: column; }
    .search-input { width: 100%; padding: 8px 12px; border: 1px solid var(--gray-300); border-radius: 6px; margin-bottom: 8px; font-size: 0.9rem; }
    .teacher-items { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .teacher-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; }
    .teacher-row:hover { background: var(--primary-light); }
    .teacher-row.selected { background: #dbeafe; font-weight: bold; color: var(--primary); }
    .role-badge { font-size: 0.75rem; background: var(--gray-200); padding: 2px 6px; border-radius: 4px; color: var(--gray-600); }

    .chips-box { border: 1px solid var(--gray-200); border-radius: 8px; padding: 14px; background: var(--gray-100); min-height: 100px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; background: white; border: 1px solid #bfdbfe; padding: 4px 10px; border-radius: 999px; font-size: 0.85rem; margin: 3px; }
    .chip-del { cursor: pointer; color: #93c5fd; font-weight: bold; }
    .chip-del:hover { color: #ef4444; }

    /* Timetable Grid */
    .timetable-box { overflow-x: auto; border: 1px solid var(--gray-200); border-radius: 8px; margin-top: 16px; }
    table.sched-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.88rem; min-width: 600px; }
    table.sched-table th, table.sched-table td { border: 1px solid var(--gray-200); padding: 10px 8px; }
    table.sched-table th { background: #f8fafc; font-weight: 700; color: var(--gray-600); }
    
    .cell-free { background-color: #ecfdf5; color: #065f46; font-weight: bold; }
    .cell-almost { background-color: #fffbeb; color: #92400e; font-size: 0.78rem; text-align: left; padding: 6px; }
    .cell-busy { background-color: #fef2f2; color: #991b1b; font-size: 0.76rem; text-align: left; padding: 6px; }
    .busy-tag { display: inline-block; background: #fee2e2; border-radius: 3px; padding: 1px 4px; margin: 1px; }

    /* Loading overlay */
    #loading { position: fixed; inset: 0; background: rgba(255,255,255,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; font-weight: 600; color: var(--primary); }
    .spinner { width: 36px; height: 36px; border: 4px solid #bfdbfe; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <div>連線試算表載入課表資料中...</div>
  </div>

  <header>
    <div class="header-box">
      <h1><span>📅</span> 教師共同空堂與課表查詢平台</h1>
      <div class="header-badge" id="data-status">雲端連線中</div>
    </div>
  </header>

  <div class="main-wrap">
    <div class="tabs">
      <button class="tab-btn active" onclick="goTab('common')">🤝 共同空堂比對</button>
      <button class="tab-btn" onclick="goTab('slot')">⏰ 依時段反查</button>
      <button class="tab-btn" onclick="goTab('personal')">👤 教師個人課表</button>
    </div>

    <!-- TAB 1: 共同空堂 -->
    <div id="tab-common" class="panel active">
      <h3 style="margin-bottom:12px;">跨教師共同空堂快速比對</h3>
      <div class="selector-grid">
        <div class="list-box">
          <input type="text" id="t-search" class="search-input" placeholder="🔍 搜尋教師姓名或職務..." oninput="drawPicker()">
          <button style="padding:6px; font-size:0.8rem; cursor:pointer; margin-bottom:6px;" onclick="clearSelected()">清空勾選</button>
          <div class="teacher-items" id="picker-list"></div>
        </div>
        <div class="chips-box">
          <div style="font-weight:600; font-size:0.9rem; margin-bottom:8px; display:flex; justify-content:space-between;">
            <span>已選教師（<span id="sel-num">0</span> 人）</span>
            <span id="free-slots-stat" style="color:var(--success); font-weight:bold;"></span>
          </div>
          <div id="selected-chips"></div>
        </div>
      </div>

      <div class="timetable-box">
        <table class="sched-table">
          <thead>
            <tr><th style="width:80px;">節次</th><th>星期一</th><th>星期二</th><th>星期三</th><th>星期四</th><th>星期五</th></tr>
          </thead>
          <tbody id="common-grid-body"></tbody>
        </table>
      </div>
    </div>

    <!-- TAB 2: 依時段反查 -->
    <div id="tab-slot" class="panel">
      <h3 style="margin-bottom:12px;">指定時段反查空堂教師</h3>
      <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px;">
        <select id="slot-day" onchange="querySlot()" style="padding:8px; border-radius:6px;">
          <option value="1">星期一</option><option value="2">星期二</option><option value="3">星期三</option><option value="4">星期四</option><option value="5">星期五</option>
        </select>
        <select id="slot-period" onchange="querySlot()" style="padding:8px; border-radius:6px;">
          <option value="1">第 1 節</option><option value="2">第 2 節</option><option value="3">第 3 節</option><option value="4">第 4 節</option>
          <option value="5">第 5 節</option><option value="6">第 6 節</option><option value="7">第 7 節</option><option value="8">第 8 節</option>
        </select>
        <input type="text" id="slot-kw" placeholder="過濾職務 (如導師、數學)" oninput="querySlot()" style="padding:8px; border-radius:6px; min-width:200px;">
      </div>
      <div id="slot-result-stat" style="font-weight:600; margin-bottom:10px;"></div>
      <div id="slot-cards" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px; max-height:450px; overflow-y:auto;"></div>
    </div>

    <!-- TAB 3: 個人週課表 -->
    <div id="tab-personal" class="panel">
      <h3 style="margin-bottom:12px;">教師個人每週完整課表</h3>
      <div style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;">
        <select id="personal-select" onchange="drawPersonal()" style="padding:8px 12px; border-radius:6px; font-size:0.95rem; min-width:260px;"></select>
        <span id="personal-hours" style="font-weight:bold; color:var(--primary);"></span>
      </div>
      <div class="timetable-box">
        <table class="sched-table">
          <thead>
            <tr><th style="width:80px;">節次</th><th>星期一</th><th>星期二</th><th>星期三</th><th>星期四</th><th>星期五</th></tr>
          </thead>
          <tbody id="personal-grid-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let APP = { teachers: [], schedules: {} };
    let selectedTids = new Set();
    const DAYS = ["星期一", "星期二", "星期三", "星期四", "星期五"];

const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyxCHOVnxnM9SnsC6k8ag81an4uBTsKrNZPnV5OI3fTf_xuRSft7AO5q9uWsG2ItAuk/exec";

    window.addEventListener('DOMContentLoaded', () => {
      fetch(GAS_API_URL)
        .then(response => {
          if (!response.ok) throw new Error("網路連線異常");
          return response.json();
        })
        .then(data => {
          APP = data;
          document.getElementById('loading').style.display = 'none';
          document.getElementById('data-status').innerText = `已連線（${APP.teachers.length} 位教師）`;
          initUI();
        })
        .catch(err => {
          console.error(err);
          document.getElementById('loading').innerHTML = 
            `<div style="color:red; text-align:center; padding:20px;">
               載入失敗！<br><span style="font-size:0.85rem; color:#666;">請確認 Apps Script 部署權限是否設為「所有人 (Anyone)」</span>
             </div>`;
        });
    });

    function initUI() {
      drawPicker();
      renderCommonTable();
      initPersonal();
      querySlot();
    }

    function goTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      if(name === 'common') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-common').classList.add('active');
      } else if(name === 'slot') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-slot').classList.add('active');
        querySlot();
      } else {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('tab-personal').classList.add('active');
        drawPersonal();
      }
    }

    // ============= Tab 1: 共同空堂 =============
    function drawPicker() {
      const kw = document.getElementById('t-search').value.trim().toLowerCase();
      const list = document.getElementById('picker-list');
      list.innerHTML = '';
      APP.teachers.filter(t => t.教師名稱.toLowerCase().includes(kw) || t.教師職務.toLowerCase().includes(kw) || t.教師代碼.toLowerCase().includes(kw))
        .forEach(t => {
          const div = document.createElement('div');
          const isSel = selectedTids.has(t.教師代碼);
          div.className = `teacher-row ${isSel ? 'selected' : ''}`;
          div.innerHTML = `<span>${t.教師名稱}</span><span class="role-badge">${t.教師職務}</span>`;
          div.onclick = () => toggleSelect(t.教師代碼);
          list.appendChild(div);
        });
    }

    function toggleSelect(tid) {
      if(selectedTids.has(tid)) selectedTids.delete(tid);
      else selectedTids.add(tid);
      updateChips();
      drawPicker();
      renderCommonTable();
    }

    function clearSelected() {
      selectedTids.clear();
      updateChips();
      drawPicker();
      renderCommonTable();
    }

    function updateChips() {
      document.getElementById('sel-num').innerText = selectedTids.size;
      const cBox = document.getElementById('selected-chips');
      cBox.innerHTML = '';
      const tMap = new Map(APP.teachers.map(t => [t.教師代碼, t]));
      selectedTids.forEach(tid => {
        const t = tMap.get(tid);
        const span = document.createElement('span');
        span.className = 'chip';
        span.innerHTML = `${t.教師名稱} (${t.教師職務}) <span class="chip-del" onclick="toggleSelect('${tid}')">&times;</span>`;
        cBox.appendChild(span);
      });
    }

    function renderCommonTable() {
      const tbody = document.getElementById('common-grid-body');
      tbody.innerHTML = '';
      const selArr = Array.from(selectedTids);
      const tMap = new Map(APP.teachers.map(t => [t.教師代碼, t]));
      let freeCount = 0;

      for (let p = 1; p <= 8; p++) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<th style="background:#f1f5f9;">第 ${p} 節</th>`;
        for (let d = 1; d <= 5; d++) {
          const td = document.createElement('td');
          const key = `${d}-${p}`;
          if (selArr.length === 0) {
            td.innerHTML = '<span style="color:#cbd5e1;">—</span>';
          } else {
            const busyWho = selArr.filter(tid => APP.schedules[tid] && APP.schedules[tid][key]).map(tid => tMap.get(tid).教師名稱);
            if (busyWho.length === 0) {
              td.className = 'cell-free';
              td.innerText = `✓ 全員空堂`;
              freeCount++;
            } else if (busyWho.length === 1 && selArr.length > 2) {
              td.className = 'cell-almost';
              td.innerHTML = `<b>★ 差 1 人:</b> ${busyWho[0]}`;
            } else {
              td.className = 'cell-busy';
              td.innerHTML = busyWho.slice(0, 2).map(n => `<span class="busy-tag">${n}</span>`).join('') + (busyWho.length > 2 ? ` 等${busyWho.length}人` : '');
            }
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      document.getElementById('free-slots-stat').innerText = selArr.length > 0 ? `共同空堂：${freeCount} 節` : '';
    }

    // ============= Tab 2: 依時段反查 =============
    function querySlot() {
      const d = document.getElementById('slot-day').value;
      const p = document.getElementById('slot-period').value;
      const kw = document.getElementById('slot-kw').value.trim().toLowerCase();
      const key = `${d}-${p}`;

      const frees = APP.teachers.filter(t => {
        const isBusy = APP.schedules[t.教師代碼] && APP.schedules[t.教師代碼][key];
        const matchKw = !kw || t.教師名稱.toLowerCase().includes(kw) || t.教師職務.toLowerCase().includes(kw);
        return !isBusy && matchKw;
      });

      document.getElementById('slot-result-stat').innerText = `${DAYS[d-1]} 第 ${p} 節：共有 ${frees.length} 位空堂教師`;
      const cards = document.getElementById('slot-cards');
      cards.innerHTML = '';
      frees.forEach(t => {
        const d = document.createElement('div');
        d.style = "border:1px solid #e2e8f0; padding:10px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; background:#fff;";
        d.innerHTML = `<div><b>${t.教師名稱}</b><div style="font-size:0.75rem; color:#64748b;">${t.教師職務}</div></div>
                       <button onclick="viewTeacher('${t.教師代碼}')" style="padding:4px 8px; font-size:0.75rem; cursor:pointer;">課表</button>`;
        cards.appendChild(d);
      });
    }

    function viewTeacher(tid) {
      document.getElementById('personal-select').value = tid;
      goTab('personal');
    }

    // ============= Tab 3: 個人課表 =============
    function initPersonal() {
      const s = document.getElementById('personal-select');
      s.innerHTML = '';
      APP.teachers.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.教師代碼;
        opt.innerText = `${t.教師名稱} [${t.教師職務}] (${t.教師代碼})`;
        s.appendChild(opt);
      });
      drawPersonal();
    }

    function drawPersonal() {
      const tid = document.getElementById('personal-select').value;
      const tbody = document.getElementById('personal-grid-body');
      tbody.innerHTML = '';
      const sched = (APP.schedules && APP.schedules[tid]) || {};
      let total = 0;

      for (let p = 1; p <= 8; p++) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<th style="background:#f1f5f9;">第 ${p} 節</th>`;
        for (let d = 1; d <= 5; d++) {
          const td = document.createElement('td');
          const key = `${d}-${p}`;
          const items = sched[key];
          if (items && items.length > 0) {
            total += items.length;
            td.style.backgroundColor = '#eff6ff';
            td.style.textAlign = 'left';
            td.style.padding = '6px';
            td.innerHTML = items.map(l => `<div style="font-weight:bold; color:#1e40af;">${l.s}</div><div style="font-size:0.75rem; color:#64748b;">${l.c}${l.r ? ' @' + l.r : ''}</div>`).join('');
          } else {
            td.style.color = '#94a3b8';
            td.innerText = '—';
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      document.getElementById('personal-hours').innerText = `每週總節數：${total} 節`;
    }
  </script>
</body>
</html>
